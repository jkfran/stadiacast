name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras --locked
      - name: on Linux, let the pad tests reach the kernel's uinput (tests/test_linux_lab.py)
        if: runner.os == 'Linux'
        run: |
          # No login session with a seat here, so the rules name a mode instead of the tag the
          # README gives a person at the computer.
          {
            echo 'KERNEL=="uinput", SUBSYSTEM=="misc", MODE="0666", OPTIONS+="static_node=uinput"'
            echo 'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"'
          } | sudo tee /etc/udev/rules.d/99-stadiacast-lab.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo modprobe uinput || true
          sudo udevadm trigger --name-match=uinput || true
          sleep 1
          if [ -c /dev/uinput ]; then
            echo "STADIACAST_LINUX_LAB=1" >> "$GITHUB_ENV"
          else
            echo "::warning::this runner's kernel has no uinput device: the pad tests skip"
          fi
      - run: uv run pytest -q
      - run: uv run python -m stadiacast.schema_compiler --check

  lowest:
    # Every direct dependency at the lowest version pyproject.toml allows, on the lowest Python,
    # so the declared floors stay true. Installed for this platform only, outside the lock.
    name: test (ubuntu-latest, py3.11, lowest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install --resolution lowest-direct -e ".[ble,passthrough,audio,gamepad]" --group dev
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m stadiacast.schema_compiler --check

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: shellcheck tools/*.sh

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: install the wheel in a clean environment and run the commands
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/stadiacast --version
          /tmp/wheel-venv/bin/stadiacast --help > /dev/null
          /tmp/wheel-venv/bin/stadiacast-show-input --help > /dev/null
          /tmp/wheel-venv/bin/stadiacast-provision --help > /dev/null
