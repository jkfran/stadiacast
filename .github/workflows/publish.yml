# Publishes the sdist and the wheel to PyPI once a GitHub release is published. The Release
# workflow drafts the release with those two files attached; publishing the draft is the human
# step, and this takes the files from the release, so PyPI carries exactly what GitHub does.
# The manual trigger publishes an existing release by tag. No token anywhere: PyPI trusts this
# workflow's identity (OpenID Connect) through the trusted publisher registered on PyPI for
# the project, which names this repository, this file and the `pypi` environment. PyPI refuses
# every other repository, so in a fork the job is skipped instead of failing.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the release to publish, e.g. v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    name: upload to PyPI
    # the repository is named here: after a rename or a transfer this line has to follow
    if: github.repository == 'jkfran/stadiacast'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/stadiacast/
    permissions:
      contents: read  # gh release download
      id-token: write  # the OpenID Connect token that PyPI exchanges for an upload credential
    steps:
      - name: the release's sdist and wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "stadiacast-${version}.tar.gz" \
            --pattern "stadiacast-${version}-py3-none-any.whl"
          ls -l dist
      - name: upload (files already on PyPI are skipped)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
