// Display <-> controller RPC payloads of the Stadia Controller (Gotham firmware
// ota.282115, display connection code), documented from the firmware's nanopb
// field tables.  The firmware has no FileDescriptorProto for these types: field
// numbers, wire types, max sizes, nesting and the oneof-vs-optional structure are
// the tables'; every NAME is ours, chosen from how the display-connection code uses
// the field ("fN" / "requestN" where the use is not known yet).
//
// Envelope: these bytes travel as RpcRequest.payload / RpcNotification.payload /
// RpcResponse.payload (rpc_message.proto) in WireHeader2 records on the display
// link (id 0x74 from the controller, 0x75 from the display).
//
// nanopb notes: VARINT fields stored in one byte are bool / uint8 / small enums
// (the table only says "varint, 1 byte"); every static field is OPTIONAL with a
// has_ flag; the ControllerToDisplay variants are a nanopb oneof.
//
// Compile: python3 tools/compile_protos.py   (see README.md in this directory)

syntax = "proto2";

package gotham.display;

// ---------------------------------------------------------------------------
// Display -> controller.  nanopb table 0x6037c5ce, struct 0x118 bytes, 25 optional
// sub-messages.  Requests and notifications from the display, and the display's
// responses to the controller's requests, all decode as this type.  Routing in
// HandleIncomingRpcMessage: request with #2 -> event 3 GET_CONTROLLER_STATE_RECEIVED,
// with #12 -> 14 DISCONNECT_REQUEST_RECEIVED, other requests -> 13
// CONTROLLER_MESSAGE_RECEIVED (dispatcher); notification #19 -> 15, #24 -> 16,
// #25 -> 17, #27 -> 18, #26 -> 19.
// ---------------------------------------------------------------------------
message DisplayToController {
  optional ProxyResponse proxy_response = 1;               // answer to ControllerToDisplay #1
  optional GetControllerStateRequest get_controller_state = 2;    // -> event 3 GET_CONTROLLER_STATE_RECEIVED
  optional Empty focus_menu = 3;                           // dispatcher (app event 3 FOCUS_MENU)
  optional Empty focus_game = 4;                           // dispatcher (app event 4 FOCUS_GAME)
  optional BoolValue request5 = 5;
  optional Empty request6 = 6;
  optional Empty request7 = 7;
  optional StringAndInt start_game = 8;                    // (str, int default 1)
                                                           // (app event 0xb START_GAME; reply held until GAME_STARTED/STOPPED)
  optional String23 stop_game = 9;                         // (str) STOP_GAME
  optional String31 request10 = 10;                        // (str)
  optional String31 request11 = 11;                        // (str)
  optional DisconnectRequest disconnect = 12;              // -> event 14
  optional Int64Value f13 = 13;                            // use unknown
  optional Empty request14 = 14;
  optional SetAudioModeRequest set_audio_mode = 16;
  optional Empty request17 = 17;
  optional FloatValue request18 = 18;                      // (float, default -1.0)
  optional KeepaliveStatus keepalive_status = 19;          // -> event 15
  optional GetCurrentTimeResponse current_time = 21;       // HandleGetDisplayTimeResponse
  optional Int32Value f22 = 22;                            // use unknown
  optional Empty f23 = 23;                                 // use unknown
  optional DisplayStatus display_status = 24;              // -> event 16
  optional SetPowerConfig set_power_config = 25;           // -> event 17
  optional Empty reset_display_connection = 26;            // -> event 19
  optional DisplayInputRedirect display_input_redirect = 27;   // -> event 18
}

// ---------------------------------------------------------------------------
// Controller -> display.  nanopb table 0x6037cdb7, struct 0x268 bytes, a 17-variant
// oneof.  The variant is the `which` value each sender stores after zeroing the struct.
// ---------------------------------------------------------------------------
message ControllerToDisplay {
  oneof variant {
    ProxyRequest proxy_request = 1;                        // request (event 12 SEND_PROXY_REQUEST)
    GetControllerStateResponse controller_state = 2;       // response to DisplayToController #2
    Message3 message3 = 3;                                 // notification: input state (HandleInput)
    AudioConfigurationChanged audio_configuration_changed = 4;   // notification
    Empty message5 = 5;
    StatusNotification streaming_stopped = 6;              // notification
    StatusNotification status7 = 7;                        // notification
    DisconnectRequest disconnect = 8;                      // request, on entry to R/S/WAITING_FOR_DISCONNECT_RESPONSE
    FloatValue message9 = 9;
    FloatValue notification10 = 10;                        // notification
    UInt8Value notification11 = 11;                        // notification (enum 1..3 mapped)
    Empty message12 = 12;
    Empty message13 = 13;
    Int64Value keepalive = 14;                             // request every 1.5 s in READY, sent empty
    KeepaliveStatus keepalive_status = 16;                 // notification
    GetCurrentTimeRequest get_current_time = 18;           // request every 3 s in READY
    FloatValue message19 = 19;
  }
}

// ---------------------------------------------------------------------------
// Sub-messages
// ---------------------------------------------------------------------------

message Empty {
}

// The display's answer to a ProxyRequest (ControllerToDisplay #1): `data` is the
// serialized inner RpcMessage response (streamer_message.proto, "Game-phase entry").
message ProxyResponse {
  optional bytes data = 1;                     // callback field
}

// HandleIncomingRpcMessage logs "GetControllerStateRequest:
// display_supports_send_log_report = true/false" (or "... missing", in which
// case the firmware passes TRUE on: the has-flag of the outer field is reused).
message GetControllerStateRequest {
  optional bool display_supports_send_log_report = 2;
}

message BoolValue {
  optional bool value = 1;
}

message UInt8Value {
  optional uint32 value = 1;                   // 1 byte
}

message Int32Value {
  optional int32 value = 1;
}

message Int64Value {
  optional int64 value = 1;
}

message FloatValue {
  optional float value = 1;                    // fixed32 in the table; the firmware treats it as float
}

message String23 {
  optional string value = 1;                   // max 23
}

message String31 {
  optional string value = 1;                   // max 31
}

// StartGame: value = the game/session key (max 23), number = 1.
message StringAndInt {
  optional string value = 1;                   // max 23
  optional int32 number = 2;
}

// Display #12 / controller #8: same 1-byte field.  The controller's own request
// carries a reason mapped from its state machine.
message DisconnectRequest {
  optional uint32 reason = 1;                  // 1 byte
}

// "Unsupported audio mode: UDP_PCM" for mode 3; modes 1, 2, 4 are mapped to
// 1, 2, 3 for the audio path.
message SetAudioModeRequest {
  optional uint32 mode = 1;                    // 1 byte, 1..4
  optional bool f2 = 2;
  optional bool f3 = 3;
}

// Same table (0x6037d523) in both directions.  "KeepaliveStatusNotification
// from display: keepalive resumed" (1) / "... keepalive missing" (2).
message KeepaliveStatus {
  optional uint32 status = 1;                  // 1 byte: 1 = RESUMED, 2 = MISSING
}

// The display's answer to GetCurrentTimeRequest.  remote_clock.cc computes
// rtt = now - controller_time_us and CHECK-fails when rtt < 0, so the
// display must echo the request's value unchanged.
message GetCurrentTimeResponse {
  optional int64 controller_time_us = 1;       // echo of GetCurrentTimeRequest.controller_time_us
  optional int64 display_time_us = 2;          // display clock at reply time (Unix epoch µs)
}

message GetCurrentTimeRequest {
  optional int64 controller_time_us = 1;       // ToUnixMicros(controller clock now)
}

// READY + #24 status 2 -> R/C/SUSPENDED; SUSPENDED + status 1 -> READY.
message DisplayStatus {
  optional uint32 status = 1;                  // 1 byte
}

message SetPowerConfig {
  optional int32 f1 = 1;
  optional int32 f2 = 2;
}

message DisplayInputRedirect {
  optional bool f1 = 1;
  optional bool f2 = 2;
}

// The controller's StreamingClient RPCs, tunnelled through the display link:
// f1 = 1, f2 = the StartGame key, body = a serialized inner RpcMessage request
// carrying a StreamerRequest (streamer_message.proto).
message ProxyRequest {
  optional uint32 f1 = 1;                      // 1 byte; 1 seen in GenerateInitializationRequest
  oneof target {
    string f2 = 2;                             // max 23
    string f3 = 3;                             // max 31
  }
  optional bytes body = 4;                     // callback field: inner RpcMessage
}

// Filled from the device-info object and sent with Respond(OK) as the answer to
// GetControllerStateRequest.
message GetControllerStateResponse {
  optional string device_id = 1;               // max 47 (also RegisterControllerRequest.device_id)
  optional bool f2 = 2;
  optional bool f3 = 3;
  optional bool f4 = 4;
  optional bool f5 = 5;
  optional string f6 = 6;                      // max 23
  optional string f7 = 7;                      // max 31
  optional bool f8 = 8;
  optional DeviceInfo device_info = 9;
  optional fixed32 f10 = 10;
  optional uint32 f11 = 11;                    // 1 byte, enum mapped from 1..3
  optional string f12 = 12;                    // max 31
  optional string f13 = 13;                    // max 23
  optional string f14 = 14;                    // max 23
  optional string f15 = 15;                    // max 15
  optional string f16 = 16;                    // max 15
  optional string f17 = 17;                    // max 15
  optional uint32 f18 = 18;                    // 1 byte
  optional uint32 f20 = 20;                    // 1 byte; set to 1
}

// Sub-table 0x6037d410 (340 bytes), shared by GetControllerStateResponse.9 and
// AudioConfigurationChanged.3.
message DeviceInfo {
  optional int32 f1 = 1;
  optional string f2 = 2;                      // max 47
  optional int32 f3 = 3;
  optional bytes f4 = 4;                       // max 258
  optional bool f5 = 5;
  optional int32 f6 = 6;
  optional bool f7 = 7;
}

// Input state (DisplayConnection::HandleInput): an RpcNotification sent in READY only,
// on change.  XINPUT_GAMEPAD-like; decoded by stadiacast.gamepad.
message Message3 {
  optional uint32 f1 = 1;   // buttons: 0-3 D-pad U/D/L/R, 4 Menu, 5 Options, 6 L3, 7 R3, 8 L1, 9 R1,
                            //          10 Assistant, 11 Capture, 12 A, 13 B, 14 X, 15 Y, 16 Stadia
  optional sint32 f2 = 2;   // left stick X  (-32768..32767)
  optional sint32 f3 = 3;   // left stick Y  (up = +)
  optional sint32 f4 = 4;   // right stick X
  optional sint32 f5 = 5;   // right stick Y (up = +)
  optional uint32 f6 = 6;   // L2 trigger 0..255
  optional uint32 f7 = 7;   // R2 trigger 0..255
}

message AudioConfigurationChanged {
  optional uint32 mode = 1;                    // 1 byte
  optional bool f2 = 2;
  optional DeviceInfo device_info = 3;
}

// #6 "SendStreamingStoppedNotification" and #7: an absl::Status as {code, message}.
message StatusNotification {
  optional uint32 code = 1;                    // 1 byte
  optional string message = 2;                 // max 127
}
