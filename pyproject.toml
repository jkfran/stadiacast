[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=23.2"]
build-backend = "hatchling.build"

[project]
name = "stadiacast"
dynamic = ["version", "readme"]
description = "A local server for the Stadia Controller's Wi-Fi mode: keeps the controller working with your own PC after the Stadia shutdown"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Francisco Jimenez Cabrera" }]
keywords = ["stadia", "controller", "gamepad", "webrtc", "dtls", "srtp", "interoperability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "protobuf>=4.25",
  "cryptography>=42",
  "pyOpenSSL>=24.3",
]

[project.optional-dependencies]
ble = ["bleak>=0.21"]
passthrough = ["aiohttp>=3.9"]
gamepad = ["vgamepad>=0.2; sys_platform == 'win32'"]  # the ViGEm virtual gamepad (Windows)
audio = [  # system audio capture: PortAudio everywhere, WASAPI loopback on Windows
  "sounddevice>=0.4.6; sys_platform != 'win32'",
  "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.14.14",
  "mypy>=1.16",
  "types-protobuf>=7.34.1",
]
release = ["pyinstaller>=6.11"]  # the standalone executables (make exe, the Release workflow)

[project.urls]
Homepage = "https://github.com/jkfran/stadiacast"
Issues = "https://github.com/jkfran/stadiacast/issues"
Changelog = "https://github.com/jkfran/stadiacast/blob/main/CHANGELOG.md"

[project.scripts]
stadiacast = "stadiacast.cli:main"
stadiacast-provision = "stadiacast.ble_provisioner:main"
stadiacast-show-input = "stadiacast.show_input:main"

[tool.hatch.version]
path = "src/stadiacast/__init__.py"

# The README is also the PyPI description, where its relative links have no repository around
# them: they become links to the release's tag on GitHub. In-page anchors and absolute URLs stay.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?![a-z][a-z0-9+.-]*:|#)([^)\s]+)\)'
replacement = '](https://github.com/jkfran/stadiacast/blob/v$HFPR_VERSION/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?![a-z][a-z0-9+.-]*:|#)([^"]+)"'
replacement = 'href="https://github.com/jkfran/stadiacast/blob/v$HFPR_VERSION/\1"'

[tool.hatch.build.targets.wheel]
packages = ["src/stadiacast"]

[tool.hatch.build.targets.sdist]
include = [
  "src", "tests", "tools", "docs", "packaging", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
  "CODE_OF_CONDUCT.md", "LICENSE", "NOTICE", "pyproject.toml", "Makefile", ".env.example",
]

# --- tooling -----------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PIE", "PERF", "PT", "ISC", "ARG", "RET", "A", "LOG", "FURB"]
ignore = [
  "SIM105",  # try/except/pass is clearer than contextlib.suppress in socket code
  "PT011",   # pytest.raises(ValueError) without match= is fine for our small helpers
  "PT018",   # the suite asserts several related facts per line on purpose
  "RUF001", "RUF002", "RUF003",  # the Stadia button glyphs (≡, ⋯) appear in comments and strings
]

[tool.ruff.lint.isort]
known-first-party = ["stadiacast", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"


[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true  # the optional extras (bleak, aiohttp, sounddevice, pyaudiowpatch, vgamepad) may be absent

[tool.coverage.run]
source = ["stadiacast"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
